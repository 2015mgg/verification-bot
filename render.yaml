        value: 1527436686206701638
      - key: VERIFIED_ROLE_ID
        value: 1527436686206701641
      - key: UNVERIFIED_ROLE_ID
        value: 1535811378009608202
      - key: LOG_CHANNEL_ID
        value: 1535798632484184194
      - key: WELCOME_CHANNEL_ID
        value: 1527487602813304902
